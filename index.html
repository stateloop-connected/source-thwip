<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="THWIP - a first-person web-swinging flow-state game in a procedurally generated comic city. Zero assets, all code." />
    <meta name="theme-color" content="#0b0d14" />

    <!--
      Link preview cards. Absolute URLs are required here: crawlers resolve
      these without a document base, so the relative `base` Vite builds with
      would leave them pointing at nothing.

      og.jpg is the one file the project ships that the game never loads. It
      is fetched by crawlers only, so the zero-network-requests promise below
      still holds at runtime.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THWIP" />
    <meta property="og:url" content="https://ianmolagarwal.github.io/thwip/" />
    <meta property="og:title" content="THWIP — a first-person web-swinging game" />
    <meta
      property="og:description"
      content="Swing through a procedurally generated comic city. Hand-rolled swing physics, zero assets, 60fps in your browser."
    />
    <meta property="og:image" content="https://ianmolagarwal.github.io/thwip/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A halftone-printed comic city skyline at sunset, seen from above the rooftops."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THWIP — a first-person web-swinging game" />
    <meta
      name="twitter:description"
      content="Swing through a procedurally generated comic city. Hand-rolled swing physics, zero assets, 60fps in your browser."
    />
    <meta name="twitter:image" content="https://ianmolagarwal.github.io/thwip/og.jpg" />

    <!-- Inline data URI: keeps the "zero network requests" promise honest. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ff1f3d'/%3E%3Cg stroke='%23080810' stroke-width='2.4' stroke-linecap='round' fill='none'%3E%3Cpath d='M16 12 8 5M16 12 24 5M16 16 4 13M16 16 28 13M16 18 5 23M16 18 27 23M16 20 9 29M16 20 23 29'/%3E%3C/g%3E%3Cellipse cx='16' cy='16.5' rx='4.4' ry='6.4' fill='%23080810'/%3E%3C/svg%3E"
    />
    <title>THWIP</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="ui"></div>
    </div>
    <noscript>
      <div class="noscript-note">THWIP needs JavaScript and WebGL2 to run.</div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
